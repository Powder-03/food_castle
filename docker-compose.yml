version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: food_castle_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_castle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_castle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: food_castle_web
    ports:
      - "8000:8000"
    environment:
      - ADMIN_1_USERNAME=${ADMIN_1_USERNAME:-i}
      - ADMIN_1_PASSWORD=${ADMIN_1_PASSWORD:-admin1pass}
      - ADMIN_2_USERNAME=${ADMIN_2_USERNAME:-a}
      - ADMIN_2_PASSWORD=${ADMIN_2_PASSWORD:-admin2pass}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/food_castle_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
